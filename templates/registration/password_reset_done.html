{% extends "base.html" %}

{% block extra_css %}
<style>
  .auth-container {
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .auth-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 450px;
    padding: 3rem 2.5rem;
    border: 1px solid rgba(255,255,255,0.2);
    text-align: center;
    animation: slideUp 0.6s ease-out;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .success-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #10b981, #34d399);
    color: white;
    font-size: 2.5rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 2rem;
    box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
  }

  .auth-title {
    color: #1e293b;
    font-weight: 700;
    font-size: 1.75rem;
    margin-bottom: 1rem;
  }

  .auth-subtitle {
    color: #64748b;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 2rem;
  }

  .btn-auth {
    display: inline-block;
    padding: 0.875rem 2rem;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .btn-auth:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
    color: white;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="success-icon">
      <i class="fas fa-check"></i>
    </div>
    <h2 class="auth-title">Email Sent!</h2>
    <p class="auth-subtitle">
      Check your inbox. We've sent instructions on how to reset your password to your registered email address.
    </p>
    <div class="mt-4">
      <a href="{% url 'login' %}" class="btn-auth">Return to Login</a>
    </div>
    <p class="text-muted small mt-4">
      If you don't see it, check your spam folder.
    </p>
  </div>
</div>
{% endblock %}
