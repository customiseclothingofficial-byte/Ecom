{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<style>
    .payment-container {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
    }
    .payment-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        max-width: 450px;
        width: 100%;
        overflow: hidden;
    }
    .payment-header {
        background: #7c3aed;
        color: white;
        padding: 30px;
        text-align: center;
    }
    .payment-body {
        padding: 40px 30px;
        text-align: center;
    }
    .amount-display {
        font-size: 36px;
        font-weight: 800;
        color: #111;
        margin-bottom: 5px;
    }
    .order-id {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 30px;
    }
    .loader-container {
        margin: 20px 0;
    }
    .spinner-custom {
        width: 50px;
        height: 50px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #7c3aed;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        display: inline-block;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div class="payment-container">
    <div class="payment-card">
        <div class="payment-header">
            <h4 class="mb-0">Secure Payment</h4>
        </div>
        <div class="payment-body">
            <div class="loader-container" id="payment-loader">
                <div class="spinner-custom"></div>
                <p class="mt-3 text-muted">Opening secure payment gateway...</p>
            </div>
            
            <div class="amount-display">₹{{ amount }}</div>
            <div class="order-id">Order ID: #{{ order.id }}</div>

            <button id="rzp-button1" class="btn btn-dark w-100 py-3 fw-bold" style="border-radius: 12px; display: none;">
                PROCEED TO PAY
            </button>
            
            <p class="mt-4 text-muted small">
                <i class="fas fa-lock me-1"></i> Your payment is secured with 256-bit encryption
            </p>
        </div>
    </div>
</div>

<form action="{{ callback_url }}" method="POST" id="razorpay-form" style="display: none;">
    {% csrf_token %}
    <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
    <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
    <input type="hidden" name="razorpay_signature" id="razorpay_signature">
</form>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    const rzpKey = "{{ razorpay_key_id }}";
    
    // Check for placeholder keys
    if (rzpKey === "YOUR_KEY_ID" || rzpKey === "" || rzpKey.includes("your_key")) {
        console.error("Razorpay Key ID is not configured!");
        const loader = document.getElementById('payment-loader');
        if (loader) {
            loader.innerHTML = `
                <div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle"></i><br>
                    <strong>Razorpay Not Configured</strong><br>
                    Please update RAZORPAY_KEY_ID in settings.py
                </div>`;
        }
    }

    const options = {
        "key": rzpKey,
        "amount": "{{ amount_paise }}",
        "currency": "{{ currency }}",
        "name": "Customise Clothing",
        "description": "Premium Merchandise Order #{{ order.id }}",
        "image": "https://veirdo.in/cdn/shop/files/veirdo_logo_300x.png",
        "order_id": "{{ razorpay_order_id }}",
        "handler": function (response){
            console.log("Payment successful, signature:", response.razorpay_signature);
            document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
            document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
            document.getElementById('razorpay_signature').value = response.razorpay_signature;
            document.getElementById('razorpay-form').submit();
        },
        "prefill": {
            "name": "{{ order.full_name }}",
            "email": "{{ order.user.email|default:'' }}",
            "contact": "{{ order.phone }}"
        },
        "theme": {
            "color": "#7c3aed"
        },
        "modal": {
            "ondismiss": function(){
                console.log("Payment modal dismissed by user");
                document.getElementById('payment-loader').style.display = 'none';
                document.getElementById('rzp-button1').style.display = 'block';
            }
        }
    };

    window.addEventListener('load', function() {
        console.log("Payment page loaded, initializing Razorpay...");
        try {
            const rzp1 = new Razorpay(options);
            
            document.getElementById('rzp-button1').onclick = function (e) {
                rzp1.open();
                e.preventDefault();
            }

            // Auto open after a small delay
            if (rzpKey !== "YOUR_KEY_ID" && rzpKey !== "" && !rzpKey.includes("your_key")) {
                setTimeout(function() {
                    console.log("Opening Razorpay modal...");
                    rzp1.open();
                }, 1000);
            }
        } catch (err) {
            console.error("Razorpay Initialization failed:", err);
        }
    });
</script>
{% endblock %}
